name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Modules are tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -count=1 ./...

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Use the faster disk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\tmp | Out-Null
          "TMP=D:\tmp" >> $env:GITHUB_ENV
          "TEMP=D:\tmp" >> $env:GITHUB_ENV
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
